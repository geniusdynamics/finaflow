openapi: 3.1.0
info:
  title: FinaFlow Integration API
  description: |
    REST API for external integrators. All endpoints require an API key
    (`Authorization: Bearer fna_...`) unless noted otherwise.

    **Response envelope** — every response uses:
    - Success: `{ "data": <payload>, "meta": { "requestId": "req_..." } }`
    - Error: `{ "error": { "code": "ERROR_CODE", "message": "Human text" }, "meta": { "requestId": "req_..." } }`

    **Pagination** — list endpoints accept `?offset=0&limit=20` (max 100).
    Responses include `meta.pagination: { page, limit, total, totalPages }`.

    **Rate limits** — 100 requests/minute per IP. Headers: `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, `X-RateLimit-Reset`, `Retry-After`.
  version: 1.0.0
  contact:
    name: FinaFlow Support

servers:
  - url: /api/v1
    description: v1 API (relative to host)

security:
  - BearerAuth: []

tags:
  - name: Verify
    description: API key verification
  - name: Accounts
    description: Chart of accounts
  - name: Bills
    description: Purchase bills sync
  - name: Expenses
    description: Expense listing for pull sync
  - name: Subscriptions
    description: Subscription renewals and payment history
  - name: Statements
    description: M-PESA statement parsing, import, analysis and exports
  - name: Suppliers
    description: Supplier management
  - name: Categories
    description: Expense categories
  - name: Business
    description: Business profile
  - name: Locations
    description: Branches / locations
  - name: Users
    description: User management and roles
  - name: Daily Sales
    description: Sales ingestion
  - name: Webhooks
    description: Incoming webhook receivers

paths:
  /verify:
    get:
      operationId: verifyApiKey
      summary: Verify API key
      description: Returns the business identity for the authenticated API key.
      tags: [Verify]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Key is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"

  /accounts:
    get:
      operationId: listAccounts
      summary: List accounts
      description: List all accounts for the authenticated business.
      tags: [Accounts]
      security:
        - BearerAuth: []
        - ScopeAuth: ["accounts:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: accountType
          in: query
          schema:
            type: string
          description: Filter by account type (e.g. asset, liability, revenue, expense)
      responses:
        "200":
          description: Paginated list of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
    post:
      operationId: upsertAccount
      summary: Create or update a chart-of-accounts entry
      description: |
        Upserts a CoA row by `(externalSystem='finabill', externalId)`, falling back to
        `accountType` + `accountCode`/name matching. Returns the FinaFlow account id.
      tags: [Accounts]
      security:
        - BearerAuth: []
        - ScopeAuth: ["accounts:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId, name, accountType]
              properties:
                externalId: { type: string }
                name: { type: string, maxLength: 100 }
                accountCode: { type: string, maxLength: 20, nullable: true }
                accountType: { type: string, enum: [asset, liability, equity, revenue, expense] }
                accountSubType: { type: string, nullable: true }
                description: { type: string, nullable: true }
      responses:
        "200":
          description: Existing account updated
        "201":
          description: Account created
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /accounts/{id}:
    get:
      operationId: getAccount
      summary: Get one account or bank account
      tags: [Accounts]
      security:
        - BearerAuth: []
        - ScopeAuth: ["accounts:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Account detail }
        "404": { description: Account not found }
    patch:
      operationId: updateAccount
      summary: Update an account
      tags: [Accounts]
      security:
        - BearerAuth: []
        - ScopeAuth: ["accounts:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                accountCode: { type: string, maxLength: 20 }
                accountNumber: { type: string, maxLength: 100 }
                isActive: { type: boolean }
                isPaymentMethod: { type: boolean }
      responses:
        "200": { description: Account updated }
        "404": { description: Account not found }
  /accounts/{id}/transactions:
    get:
      operationId: listAccountTransactions
      summary: List ledger entries for a money account
      description: |
        Paginated ledger history for one operational (money) account. Cursor-based:
        pass `sinceEntryId` to fetch entries with an id greater than the cursor.
      tags: [Accounts]
      security:
        - BearerAuth: []
        - ScopeAuth: ["accounts:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sinceEntryId
          in: query
          schema:
            type: integer
          description: Return only ledger entries with id greater than this value
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Ledger entries (id, entryType, amount, balanceAfter, transactionType, description, refNo, entryDate)
        "404":
          description: Account not found for this business

  /bills:
    get:
      operationId: listBills
      summary: List bills with items
      description: Bills with line items, supplier reference, status, paid amounts, and externalId. Supports `updatedSince` cursor.
      tags: [Bills]
      security:
        - BearerAuth: []
        - ScopeAuth: ["bills:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
          description: Only return bills updated after this timestamp
      responses:
        "200":
          description: Paginated list of bills with items
    post:
      operationId: upsertBill
      summary: Create or update a bill
      description: |
        Upserts a bill and its line items by `(externalSystem='finabill', externalId)`.
        The supplier is resolved by its externalId (created if missing).
        Status mapping: draft/received → pending, partial → partial, paid → paid, void → cancelled.
      tags: [Bills]
      security:
        - BearerAuth: []
        - ScopeAuth: ["bills:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalId, description, amount, issueDate, dueDate, status]
              properties:
                externalId: { type: string }
                billNumber: { type: string, maxLength: 100, nullable: true }
                description: { type: string }
                amount: { type: string }
                amountPaid: { type: string, nullable: true }
                issueDate: { type: string, format: date }
                dueDate: { type: string, format: date }
                status: { type: string, enum: [draft, received, partial, paid, void] }
                locationId: { type: integer, nullable: true }
                supplier:
                  type: object
                  nullable: true
                  required: [name]
                  properties:
                    externalId: { type: string, nullable: true }
                    name: { type: string }
                    email: { type: string, nullable: true }
                    phone: { type: string, nullable: true }
                    taxId: { type: string, nullable: true }
                items:
                  type: array
                  items:
                    type: object
                    required: [itemName, unitPrice, totalPrice]
                    properties:
                      itemName: { type: string, maxLength: 255 }
                      quantity: { type: string, nullable: true }
                      unitPrice: { type: string }
                      totalPrice: { type: string }
                      notes: { type: string, nullable: true }
      responses:
        "200":
          description: Existing bill updated
        "201":
          description: Bill created
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /expenses:
    get:
      operationId: listExpenses
      summary: List expenses
      description: Expenses with category, account, and bill references. Supports `updatedSince` cursor.
      tags: [Expenses]
      security:
        - BearerAuth: []
        - ScopeAuth: ["expenses:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
          description: Only return expenses updated after this timestamp
      responses:
        "200":
          description: Paginated list of expenses

  /subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscriptions
      description: Recurring subscriptions with cycle, due date, and lifecycle status. Supports `updatedSince` cursor.
      tags: [Subscriptions]
      security:
        - BearerAuth: []
        - ScopeAuth: ["subscriptions:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
          description: Only return subscriptions updated after this timestamp
      responses:
        "200":
          description: Paginated list of subscriptions

  /subscriptions/payments:
    get:
      operationId: listSubscriptionPayments
      summary: List subscription payments
      description: |
        Payment history for subscriptions (pending rows have `paidDate: null` and `confirmed: false`).
        Supports `updatedSince` cursor.
      tags: [Subscriptions]
      security:
        - BearerAuth: []
        - ScopeAuth: ["subscriptions:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
          description: Only return payments updated after this timestamp
      responses:
        "200":
          description: Paginated list of subscription payments

  /subscriptions/{id}/payments:
    post:
      operationId: recordSubscriptionPayment
      summary: Record a subscription payment
      description: |
        Records a payment for one subscription cycle (idempotent per `cycleDueDate`).
        Posts to accounting per the subscription's `postingMode`. Repeats for the same
        cycle return `409 CONFLICT`.
      tags: [Subscriptions]
      security:
        - BearerAuth: []
        - ScopeAuth: ["subscriptions:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod]
              properties:
                paymentMethod:
                  type: string
                  enum: [cash, wallet, bank_transfer, card]
                amount:
                  type: string
                  description: "Payment amount as decimal string (defaults to the subscription amount)"
                cycleDueDate:
                  type: string
                  format: date
                  description: "Cycle being paid (defaults to the subscription's nextDueDate)"
                paidDate:
                  type: string
                  format: date
                accountId:
                  type: integer
                reference:
                  type: string
                notes:
                  type: string
                advance:
                  type: boolean
                  default: true
                  description: Advance the subscription schedule one cycle when paying the current cycle
      responses:
        "201":
          description: Payment recorded
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          description: Payment for this cycle already recorded

  /suppliers:
    get:
      operationId: listSuppliers
      summary: List suppliers
      tags: [Suppliers]
      security:
        - BearerAuth: []
        - ScopeAuth: ["suppliers:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of suppliers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierListResponse"
    post:
      operationId: upsertSupplier
      summary: Create or update a supplier
      description: |
        If `externalId` is provided and matches an existing supplier, it is updated.
        Otherwise a new supplier is created.
      tags: [Suppliers]
      security:
        - BearerAuth: []
        - ScopeAuth: ["suppliers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSupplierInput"
      responses:
        "200":
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertResult"
        "201":
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertResult"
        "400":
          $ref: "#/components/responses/ValidationError"

  /categories:
    get:
      operationId: listCategories
      summary: List expense categories
      description: |
        Returns expense categories for the authenticated business.
        When a category was upserted from FinaBill, `externalId` is the FinaBill category id.
      tags: [Categories]
      security:
        - BearerAuth: []
        - ScopeAuth: ["categories:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of expense categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
    post:
      operationId: upsertCategory
      summary: Create or update an expense category
      description: |
        Upsert an expense category for the authenticated business.

        Matching order:
        1. `externalId` + external system correspondence (FinaBill category id)
        2. Exact `name` within the business

        If neither matches, a new category is created.

        **Note:** `categoryType` currently supports `expense` only. Income mapping should use
        chart-of-accounts revenue accounts until FinaFlow income categories ship.
      tags: [Categories]
      security:
        - BearerAuth: []
        - ScopeAuth: ["categories:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCategoryInput"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertCategoryResult"
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertCategoryResult"
        "400":
          $ref: "#/components/responses/ValidationError"

  /categories/{id}:
    delete:
      operationId: archiveCategory
      summary: Archive an expense category
      tags: [Categories]
      security:
        - BearerAuth: []
        - ScopeAuth: ["categories:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Category archived }
        "404": { description: Category not found }
  /business/profile:
    get:
      operationId: getBusinessProfile
      summary: Get business profile
      tags: [Business]
      security:
        - BearerAuth: []
        - ScopeAuth: ["business:read"]
      responses:
        "200":
          description: Business profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BusinessProfile"
                  meta:
                    $ref: "#/components/schemas/Meta"

  /locations:
    get:
      operationId: listLocations
      summary: List locations / branches
      tags: [Locations]
      security:
        - BearerAuth: []
        - ScopeAuth: ["locations:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"

  /users:
    get:
      operationId: listUsers
      summary: List users
      description: List all users assigned to the business, including role and location assignments.
      tags: [Users]
      security:
        - BearerAuth: []
        - ScopeAuth: ["users:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
    post:
      operationId: upsertUser
      summary: Create or update a user
      description: |
        If `externalId` is provided and matches an existing user, it is updated.
        Otherwise a new user is created with a random password (the user must
        reset it via the normal flow).
      tags: [Users]
      security:
        - BearerAuth: []
        - ScopeAuth: ["users:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertUserInput"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertResult"
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertResult"
        "400":
          $ref: "#/components/responses/ValidationError"

  /roles:
    get:
      operationId: listRoleTemplates
      summary: List role templates
      description: List all active role templates with their permission sets.
      tags: [Users]
      security:
        - BearerAuth: []
        - ScopeAuth: ["users:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated list of role templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        role:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
                  meta:
                    $ref: "#/components/schemas/PaginatedMeta"

  /bills/{id}:
    get:
      operationId: getBill
      summary: Get one bill with line items
      tags: [Bills]
      security:
        - BearerAuth: []
        - ScopeAuth: ["bills:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bill with line items
        "404":
          $ref: "#/components/responses/ValidationError"
  /bills/{id}/payments:
    get:
      operationId: listBillPayments
      summary: List payments for a bill
      tags: [Bills]
      security:
        - BearerAuth: []
        - ScopeAuth: ["bills:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Bill payments }
        "404": { description: Bill not found }
    post:
      operationId: payBill
      summary: Record a bill payment
      description: Posts the payment, ledger entries and optional bill-payment expense using the same accounting path as the app.
      tags: [Bills]
      security:
        - BearerAuth: []
        - ScopeAuth: ["bills:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentMethod, amount, paymentDate]
              properties:
                paymentMethod: { type: string, enum: [cash, wallet, bank_transfer, card] }
                amount: { type: string }
                paymentDate: { type: string, format: date }
                reference: { type: string }
                notes: { type: string }
                accountId: { type: integer }
                liabilityAccountId: { type: integer }
                categoryId: { type: integer, description: Required when the bill or its line items have no category }
      responses:
        "201": { description: Payment recorded }
        "400": { description: Invalid payment }
        "404": { description: Bill not found }
  /daily-sales:
    get:
      operationId: listDailySales
      summary: List daily sales batches
      description: Returns daily sales for the business with payment-channel rows. Filter by location, date range, source batch or update cursor.
      tags: [Daily Sales]
      security:
        - BearerAuth: []
        - ScopeAuth: ["sales:read"]
      parameters:
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Limit"
        - name: locationId
          in: query
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: updatedSince
          in: query
          schema:
            type: string
            format: date-time
        - name: sourceBatchId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated daily sales with payment channels
        "400":
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: ingestDailySales
      summary: Ingest a daily sales batch
      description: |
        Idempotent by `sourceBatchId`. Re-submitting the same batch returns
        the existing record without creating a duplicate.
      tags: [Daily Sales]
      security:
        - BearerAuth: []
        - ScopeAuth: ["sales:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailySalesInput"
      responses:
        "200":
          description: Sales batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySalesResult"
        "202":
          description: Sales batch created with warnings (unmapped channels)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySalesResult"
        "400":
          $ref: "#/components/responses/ValidationError"

  /daily-sales/{id}:
    get:
      operationId: getDailySale
      summary: Get a daily sales batch
      tags: [Daily Sales]
      security:
        - BearerAuth: []
        - ScopeAuth: ["sales:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Daily sale with payment channels }
        "404": { description: Daily sale not found }
    delete:
      operationId: deleteDailySale
      summary: Soft-delete a daily sales batch
      tags: [Daily Sales]
      security:
        - BearerAuth: []
        - ScopeAuth: ["sales:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Daily sale deleted }
        "404": { description: Daily sale not found }
  /statements/parse:
    post:
      operationId: parseStatement
      summary: Parse an M-PESA statement without importing it
      description: |
        Accepts a password-protected M-PESA PDF either as `multipart/form-data`
        (`file`, `password`, `locationId`) or JSON (`contentBase64`, `fileName`,
        `password`, `locationId`). Parses in memory, never stores the file or password.
        Rate limited to 20 requests/minute per IP. Nothing is written to the database.
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementParseInput"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                password:
                  type: string
                locationId:
                  type: integer
      responses:
        "200":
          description: Parsed preview and analysis
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /statements/analyze:
    post:
      operationId: analyzeStatement
      summary: Parse a statement and return its analysis only
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementParseInput"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                password:
                  type: string
                locationId:
                  type: integer
      responses:
        "200":
          description: Analysis blocks
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /statements/analyze/full:
    post:
      operationId: analyzeStatementFull
      summary: Consolidated, AI-ready statement analysis with report sheets
      description: |
        Stateless public analysis for one or more PDF or CSV statements. Files are parsed
        in memory, never persisted, and no location is required. The response includes the
        consolidated analysis, per-file coverage, every Excel report sheet as JSON, an
        optional deduplicated transaction list, and a data dictionary for AI agents.
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:read"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: object
                    required: [contentBase64]
                    properties:
                      fileName:
                        type: string
                        example: statement.pdf
                      contentBase64:
                        type: string
                        description: Base64 of the PDF/CSV bytes.
                      password:
                        type: string
                includeTransactions:
                  type: boolean
                  default: false
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 12
                  items:
                    type: string
                    format: binary
                password:
                  type: string
                  description: Applies to all uploaded files.
                includeTransactions:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Consolidated analysis, report sheets and optional transactions
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    properties:
                      schemaVersion:
                        type: string
                      generatedAt:
                        type: string
                        format: date-time
                      files:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      fileCount:
                        type: integer
                      totalRowCount:
                        type: integer
                      duplicateRows:
                        type: integer
                      periodStart:
                        type: string
                        nullable: true
                      periodEnd:
                        type: string
                        nullable: true
                      banks:
                        type: array
                        items:
                          type: string
                      analysis:
                        type: object
                        additionalProperties: true
                      coverage:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                      sheets:
                        type: array
                        description: One object per Excel report sheet.
                        items:
                          type: object
                          required: [name, columns, rows]
                          properties:
                            name:
                              type: string
                            columns:
                              type: array
                              items:
                                type: string
                            rows:
                              type: array
                              items:
                                type: array
                                items:
                                  oneOf:
                                    - type: string
                                    - type: number
                      transactions:
                        type: array
                        description: Present only when includeTransactions=true.
                        items:
                          type: object
                          additionalProperties: true
                      dataDictionary:
                        type: object
                        additionalProperties: true
                      warnings:
                        type: array
                        items:
                          type: string
                  meta:
                    $ref: "#/components/schemas/ResponseMeta"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /statements/import:
    post:
      operationId: importStatements
      summary: Parse and import one or more statement files
      description: |
        Each file is parsed server-side (client rows are never trusted) and inserted in
        its own transaction. Existing receipts are skipped and reported as duplicates.
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementImportInput"
      responses:
        "200":
          description: Batch imported
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Batch completed with one or more failed files
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/ValidationError"

  /statements/imports:
    get:
      operationId: listStatementImports
      summary: List statement imports
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:read"]
      parameters:
        - in: query
          name: locationId
          schema: { type: integer }
        - in: query
          name: provider
          schema: { type: string }
        - in: query
          name: batchRef
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Import history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /statements/imports/{id}:
    get:
      operationId: getStatementImport
      summary: Get one import with its analysis and rows
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:read"]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Import detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"

  /statements/imports/{id}/analysis:
    get:
      operationId: analyzeStatementImport
      summary: Rebuild the consolidated analysis for a stored import
      description: Uses the statement's live categories and tags, so analysis reflects later tagging without re-importing.
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Consolidated analysis, coverage and report sheets }
        "404": { $ref: "#/components/responses/NotFound" }

  /statements/transactions/tag:
    post:
      operationId: tagStatementTransactions
      summary: Tag many statement transactions with one category
      description: Applies a category to up to 500 rows. Rows outside the business are reported in `missing` and left unchanged.
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionIds, categoryId]
              properties:
                transactionIds:
                  type: array
                  maxItems: 500
                  items: { type: integer }
                categoryId:
                  type: integer
                  nullable: true
                  description: Null clears the category
                rememberMerchant: { type: boolean }
      responses:
        "200": { description: Tagging result with updated and missing counts }
        "400": { description: Invalid payload or foreign category }

  /statements/transactions/{id}/category:
    patch:
      operationId: setStatementTransactionCategory
      summary: Tag one statement transaction
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId]
              properties:
                categoryId: { type: integer, nullable: true }
                rememberMerchant: { type: boolean }
      responses:
        "200": { description: Category updated }
        "404": { $ref: "#/components/responses/NotFound" }

  /statements/transactions/{id}/link-bill:
    post:
      operationId: linkTransactionToBill
      summary: Link a statement transaction to a bill
      description: Records the match only by default. Set postPayment=true to also post the payment through the accounting path.
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [billId]
              properties:
                billId: { type: integer }
                postPayment: { type: boolean, default: false }
                categoryId: { type: integer }
      responses:
        "200": { description: Linked transaction and optional payment }
        "400": { description: Invalid link or uncategorised bill }
        "404": { description: Transaction or bill not found }

  /statements/imports/{id}/link-account:
    post:
      operationId: linkStatementAccount
      summary: Link imported statement rows to a bank account
      description: Sets sourceAccountId on every non-deleted row in the import. The account must belong to the same business and location.
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: integer }
      responses:
        "200": { description: Rows linked }
        "404": { description: Import or account not found }
  /statements/imports/{id}/export:
    get:
      operationId: exportStatementImport
      summary: Export an import as CSV, XLSX or JSON
      tags: [Statements]
      security:
        - BearerAuth: []
        - ScopeAuth: ["statements:read"]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: format
          schema: { type: string, enum: [csv, xlsx, json], default: csv }
        - in: query
          name: excludeCharges
          schema: { type: boolean }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: dateFormat
          schema: { type: string, enum: [iso, dd-mmm-yyyy, dd/mm/yyyy] }
        - in: query
          name: maskPii
          schema: { type: boolean }
      responses:
        "200":
          description: File download (Content-Disposition attachment)
          content:
            text/csv:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/finabill:
    post:
      operationId: receiveFinabillWebhook
      summary: Receive a FinaBill webhook
      description: |
        Incoming webhook from FinaBill. The request body must be signed with
        `X-Fina-Signature: sha256=<hex>` (HMAC-SHA256 of the raw body using
        the shared webhook secret).
      tags: [Webhooks]
      security: []
      parameters:
        - name: X-Fina-Signature
          in: header
          required: true
          schema:
            type: string
          description: "HMAC-SHA256 signature: `sha256=<hex>`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinabillWebhookPayload"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookAck"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /wallet-webhooks/{provider}:
    post:
      operationId: receiveWalletWebhook
      summary: Receive a mobile wallet webhook
      description: |
        Incoming webhook for mobile wallet providers (mpesa, airtel_money, sasapay).
        Routes the raw request to the registered provider's handler.
      tags: [Webhooks]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [mpesa, airtel_money, sasapay]
      responses:
        "200":
          description: Webhook processed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          description: Unknown provider

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API key prefixed with `fna_`. Pass as `Authorization: Bearer fna_...`"
    ScopeAuth:
      type: oauth2
      description: "Scopes required for this operation. Granted when the API key is created."
      flows:
        implicit:
          authorizationUrl: "about:blank"
          scopes:
            "accounts:read": Read accounts
            "accounts:write": Create/update chart-of-accounts entries
            "suppliers:read": Read suppliers
            "suppliers:write": Create/update suppliers
            "bills:read": Read bills with items
            "bills:write": Create/update bills
            "expenses:read": Read expenses
            "categories:read": Read expense categories
            "categories:write": Create/update expense categories
            "business:read": Read business profile
            "locations:read": Read locations
            "users:read": Read users and roles
            "users:write": Create/update users
            "sales:read": Read daily sales
            "sales:write": Ingest daily sales
            "journal:write": Create/post journal entries
            "subscriptions:read": Read subscriptions and payment history
            "subscriptions:write": Record subscription payments
            "statements:read": Read statement imports, analyses and exports
            "statements:write": Parse and import statement files
            "webhooks": Manage webhooks

  parameters:
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of items to skip
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum items to return

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: API key lacks the required scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ResponseMeta:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
    StatementParseInput:
      type: object
      required: [contentBase64]
      properties:
        fileName:
          type: string
          example: MPESA_Statement.pdf
        contentBase64:
          type: string
          description: Base64 PDF bytes (max 10 MB decoded)
        password:
          type: string
          description: Statement password; never stored
        provider:
          type: string
          enum: [mpesa]
        locationId:
          type: integer
          description: Defaults to the business's first active location

    StatementFileInput:
      type: object
      required: [fileName, contentBase64]
      properties:
        fileName:
          type: string
        contentBase64:
          type: string
        password:
          type: string
        provider:
          type: string
        overrides:
          type: object
          additionalProperties:
            type: integer
            nullable: true
          description: externalId → categoryId (null clears)
        exclude:
          type: array
          items:
            type: string
          description: externalIds to leave out of the import

    StatementImportInput:
      type: object
      required: [locationId, files]
      properties:
        locationId:
          type: integer
        batchLabel:
          type: string
        files:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/StatementFileInput"

    Meta:
      type: object
      properties:
        requestId:
          type: string
          example: req_abc123

    PaginatedMeta:
      allOf:
        - $ref: "#/components/schemas/Meta"
        - type: object
          properties:
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer
                totalPages:
                  type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: "locationId is required"
        meta:
          $ref: "#/components/schemas/Meta"

    VerifyResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            ok:
              type: boolean
            businessId:
              type: integer
            authMethod:
              type: string
        meta:
          $ref: "#/components/schemas/Meta"

    Account:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        accountCode:
          type: string
          nullable: true
        accountType:
          type: string
          nullable: true
        accountSubType:
          type: string
          nullable: true
        isActive:
          type: boolean

    AccountListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        meta:
          $ref: "#/components/schemas/PaginatedMeta"

    Supplier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true

    SupplierListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"
        meta:
          $ref: "#/components/schemas/PaginatedMeta"

    UpsertSupplierInput:
      type: object
      required: [name]
      properties:
        externalId:
          type: string
          description: Match existing supplier by ID for update
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true

    UpsertResult:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            created:
              type: boolean
        meta:
          $ref: "#/components/schemas/Meta"

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        categoryType:
          type: string
          enum: [expense]
          description: Currently always expense on FinaFlow
        defaultAccountId:
          type: integer
          nullable: true
          description: Chart-of-accounts expense account used when posting
        externalAccountCode:
          type: string
          nullable: true
        externalId:
          type: string
          nullable: true
          description: Partner system category id when synced from FinaBill
        isActive:
          type: boolean

    CategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        meta:
          $ref: "#/components/schemas/PaginatedMeta"

    UpsertCategoryInput:
      type: object
      required: [name]
      properties:
        externalId:
          type: string
          description: Partner category id (e.g. FinaBill expense_categories.id)
        name:
          type: string
          minLength: 1
          maxLength: 100
        categoryType:
          type: string
          enum: [expense, income]
          default: expense
          description: Only expense is accepted today
        defaultAccountId:
          type: integer
          nullable: true
          description: FinaFlow chart-of-accounts account id
        description:
          type: string
          nullable: true
        isActive:
          type: boolean

    UpsertCategoryResult:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            created:
              type: boolean
            categoryType:
              type: string
              enum: [expense]
            name:
              type: string
            defaultAccountId:
              type: integer
              nullable: true
        meta:
          $ref: "#/components/schemas/Meta"

    BusinessProfile:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        fiscalYearStartMonth:
          type: integer
          nullable: true
        registrationNumber:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true

    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
          nullable: true
        isActive:
          type: boolean
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true

    LocationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        meta:
          $ref: "#/components/schemas/PaginatedMeta"

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
        isActive:
          type: boolean
        assignedLocationIds:
          type: array
          items:
            type: integer

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        meta:
          $ref: "#/components/schemas/PaginatedMeta"

    UpsertUserInput:
      type: object
      required: [name, email, role]
      properties:
        externalId:
          type: string
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          type: string
          minLength: 1
          description: "One of: manager, employee, accountant, viewer, cashier"
        isActive:
          type: boolean
          default: true
        locationIds:
          type: array
          items:
            type: integer
          default: []

    DailySalesInput:
      type: object
      required: [locationId, sourceBatchId]
      properties:
        locationId:
          type: integer
        saleDate:
          type: string
          format: date
          description: Defaults to today if omitted
        sourceSystem:
          type: string
          default: finabill
        sourceBatchId:
          type: string
          minLength: 1
          description: Idempotency key — same batch ID won't create duplicates
        payments:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
              amount:
                type: string
                description: Decimal string (e.g. "12500.00")
        discountAmount:
          type: string
        voidAmount:
          type: string
        unpaidAmount:
          type: string
        ticketCount:
          type: integer
        orderCount:
          type: integer
        notes:
          type: string

    DailySalesResult:
      type: object
      properties:
        data:
          type: object
          properties:
            dailySaleId:
              type: integer
            netSales:
              type: string
            warnings:
              type: array
              items:
                type: string
            created:
              type: boolean
        meta:
          $ref: "#/components/schemas/Meta"

    FinabillWebhookPayload:
      type: object
      required: [event, businessId, data]
      properties:
        event:
          type: string
          enum: [coa.updated, supplier.updated]
        businessId:
          type: integer
        data:
          type: object

    WebhookAck:
      type: object
      properties:
        data:
          type: object
          properties:
            received:
              type: boolean
            event:
              type: string

    WebhookEventCatalog:
      description: |
        **Outgoing webhook events** (dispatched by FinaFlow to subscriber URLs):

        | Event | Description | Data fields |
        |---|---|---|
        | `sale.recorded` | Daily sales batch created | `dailySaleId`, `saleDate`, `netSales` |
        | `expense.created` | Expense recorded | `expenseId`, `amount`, `accountId` |
        | `bill.paid` | Bill payment recorded | `billId`, `paymentId`, `amount` |
        | `coa.updated` | Chart of accounts entry synced | `name`, `externalId`, `accountCode`, `accountType` |
        | `supplier.updated` | Supplier record synced | `name`, `externalId`, `email`, `phone`, `taxId` |
        | `journal.created` | Journal entry posted | `journalEntryId`, `entryDate`, `totalDebit`, `totalCredit` |

        **Signature**: Each delivery includes `X-Fina-Signature: sha256=<hex>`
        (HMAC-SHA256 of the raw JSON body using the webhook secret).

        **Retry policy**: Up to 3 attempts with exponential backoff (1s, 2s).
        All attempts recorded in `webhookDeliveries`.

webhooks:
  saleRecorded:
    description: Fired when a daily sales batch is recorded
    post:
      summary: sale.recorded
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  const: sale.recorded
                timestamp:
                  type: string
                  format: date-time
                data:
                  type: object
                  properties:
                    dailySaleId:
                      type: integer
                    saleDate:
                      type: string
                    netSales:
                      type: string
      responses:
